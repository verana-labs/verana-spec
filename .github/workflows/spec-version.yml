name: spec-version

on:
  pull_request:

permissions:
  contents: read

jobs:
  spec-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - run: python3 scripts/test-check-spec-versions.py

      - env:
          BASE: origin/${{ github.base_ref }}
        run: python3 scripts/check-spec-versions.py "$BASE"
